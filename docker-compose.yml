x-app: &app
  build: .
  image: doc-qa-rag:latest
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    FASTEMBED_CACHE_DIR: /opt/fastembed
  volumes:
    - uploads:/data/uploads
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  uploads:
