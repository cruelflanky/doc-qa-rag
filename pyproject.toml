[project]
name = "doc-qa-rag"
version = "0.1.0"
description = "Ответы на вопросы по PDF-документу: гибридный поиск в Qdrant, реранк, LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "qdrant-client>=1.15",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-community>=0.4",
    "fastembed>=0.7",
    "pypdf>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fakeredis>=2.23",
    "reportlab>=4.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: требует запущенный Qdrant (docker compose up -d qdrant)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
